<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>歯科診療録電子カルテ（様式第一号対応）</title>
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif; background:#eef2f5; }
  #root { min-height: 100vh; }
  #boot-msg { display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:12px; color:#b00020; padding:24px; text-align:center; font-size:14px; }
</style>
</head>
<body>
<div id="root"><div id="boot-msg">起動しています…<br/>（この表示が消えない場合は再読み込みしてください）</div></div>

<script>
// グローバルエラー捕捉（React/ReactDOM本体の実行エラーも画面に表示）
window.addEventListener("error", function (ev) {
  var el = document.getElementById("boot-msg");
  if (el) el.innerHTML = "読み込みエラー: " + (ev.message || "不明") +
    "<br/>(" + (ev.filename || "") + " 行" + (ev.lineno || "?") + ")";
});
// MessageChannel が機能しない埋め込み環境向けの簡易フォールバック
(function () {
  try {
    if (typeof MessageChannel === "undefined") {
      window.MessageChannel = function () {
        var p1 = { onmessage: null }, p2 = { onmessage: null };
        p1.postMessage = function (d) { setTimeout(function () { if (p2.onmessage) p2.onmessage({ data: d }); }, 0); };
        p2.postMessage = function (d) { setTimeout(function () { if (p1.onmessage) p1.onmessage({ data: d }); }, 0); };
        this.port1 = p1; this.port2 = p2;
      };
    }
  } catch (e) {}
})();
</script>

  for(const c of order){ if(codes.includes(c)) return c; }
  const caries = codes.filter(c=>CARIES_RANK[c]).sort((a,b)=>CARIES_RANK[b]-CARIES_RANK[a]);
  if(caries.length) return caries[0];
  return codes[0];
}

/* ===========================================================================
   歯式定義（継承）。FDI象限、日本式表記。前歯=中切歯・側切歯・犬歯
   =========================================================================== */
function jpLabel(jaw, side, p){ return `${side==="right"?"右":"左"}${jaw==="upper"?"上":"下"}${p}`; }
function jpLabelPrimary(jaw, side, letter){ return `${side==="right"?"右":"左"}${jaw==="upper"?"上":"下"}${letter}`; }
const QUADS = [{q:"UR",jaw:"upper",side:"right"},{q:"UL",jaw:"upper",side:"left"},{q:"LR",jaw:"lower",side:"right"},{q:"LL",jaw:"lower",side:"left"}];
function buildPermanent(){ const teeth=[]; for(const {q,jaw,side} of QUADS){ for(let p=1;p<=8;p++){ teeth.push({id:`P-${q}-${p}`,dentition:"permanent",quadrant:q,jaw,side,position:p,anterior:p<=3,label:jpLabel(jaw,side,p)}); } } return teeth; }
function buildPrimary(){ const teeth=[]; const L=["A","B","C","D","E"]; for(const {q,jaw,side} of QUADS){ for(let p=1;p<=5;p++){ teeth.push({id:`D-${q}-${p}`,dentition:"primary",quadrant:q,jaw,side,position:p,anterior:p<=3,label:jpLabelPrimary(jaw,side,L[p-1])}); } } return teeth; }
const PERMANENT = buildPermanent();
const PRIMARY = buildPrimary();
const ALL_TEETH = [...PERMANENT, ...PRIMARY];
const TOOTH_BY_ID = Object.fromEntries(ALL_TEETH.map(t=>[t.id,t]));
// FDI番号（永久歯）: 右上=1x,左上=2x,左下=3x,右下=4x、位置=末尾
function fdiOf(t){ if(t.dentition!=="permanent") return null; const Q={UR:1,UL:2,LL:3,LR:4}; return Q[t.quadrant]*10+t.position; }

/* ===========================================================================
   アーチ描画エンジン（継承：同心楕円・前歯横長楕円/臼歯円形・端角共通化）
   =========================================================================== */
function archPositions({jaw,dentition,cx,cy,rx,ry,phiStartDeg,phiEndDeg}){
  const n = dentition==="permanent"?8:5;
  return side=>{
    const out=[];
    for(let i=0;i<n;i++){
      const frac=n===1?0:i/(n-1);
      const off=phiStartDeg+(phiEndDeg-phiStartDeg)*frac;
      const phi=(side==="right"?90+off:90-off)*(Math.PI/180);
      const x=cx+rx*Math.cos(phi);
      const y=jaw==="upper"?cy-ry*Math.sin(phi):cy+ry*Math.sin(phi);
      out.push({x,y,posIndex:i+1});
    }
    return out;
  };
}
function archGuidePath({jaw,cx,cy,rx,ry,phiStartDeg,phiEndDeg}){
  const N=50, pts=[];
  for(let i=0;i<=N;i++){ const off=phiStartDeg+(phiEndDeg-phiStartDeg)*(i/N); const phi=(90+off)*(Math.PI/180); const x=cx+rx*Math.cos(phi); const y=jaw==="upper"?cy-ry*Math.sin(phi):cy+ry*Math.sin(phi); pts.push(`${x.toFixed(1)},${y.toFixed(1)}`); }
  for(let i=N;i>=0;i--){ const off=phiStartDeg+(phiEndDeg-phiStartDeg)*(i/N); const phi=(90-off)*(Math.PI/180); const x=cx+rx*Math.cos(phi); const y=jaw==="upper"?cy-ry*Math.sin(phi):cy+ry*Math.sin(phi); pts.push(`${x.toFixed(1)},${y.toFixed(1)}`); }
  return "M "+pts.join(" L ");
}
function ToothShape({tooth,size,fill,stroke,jaw}){
  const w=size, ht=size*1.28, cx=w/2, cy=ht/2, anterior=tooth.anterior;
  return h("g",null,
    h("rect",{x:w*0.08,y:ht*0.06,width:w*0.84,height:ht*0.88,rx:anterior?w*0.22:w*0.3,ry:anterior?w*0.26:w*0.3,fill,stroke,strokeWidth:Math.max(1.4,size*0.05)}),
    anterior
      ? h("ellipse",{cx,cy,rx:w*0.3,ry:ht*0.12,fill:"none",stroke,strokeWidth:Math.max(1.1,size*0.04),opacity:0.9})
      : h("circle",{cx,cy,r:w*0.2,fill:"none",stroke,strokeWidth:Math.max(1.1,size*0.04),opacity:0.9})
  );
}

   =========================================================================== */
function judgeBurden(record, patient){
  if(record.burdenManual && record.burdenRate) return { rate:record.burdenRate, basis:"手動設定" };
  const age = ageFromBirth(patient?.birth || record.birth, record.visitDate);
  if(age==null) return { rate:0.3, basis:"年齢不明→既定3割" };
  const high = record.incomeHigh;
  if(age<6) return { rate:0.2, basis:"未就学児 2割" };
  if(age<70) return { rate:0.3, basis:"就学〜69歳 3割" };
  if(age<75) return high?{rate:0.3,basis:"70-74歳 現役並み 3割"}:{rate:0.2,basis:"70-74歳 一般 2割"};
  return high?{rate:0.3,basis:"後期高齢 現役並み 3割"}:{rate:(record.lateElderly2?0.2:0.1),basis:"後期高齢 一般 "+(record.lateElderly2?"2割":"1割")};
}

function kizamiPoints(def, qty){
  const lo = def.lo!=null?def.lo:1;
  const hi = def.hi!=null?def.hi:Infinity;
  const step = def.step||1;
  let n = qty, clamped=false, errored=false;
  if(n < lo) n = lo;
  if(n > hi){ if(def.onOver==="error"){ errored=true; n=hi; } else { n=hi; clamped=true; } }
  const units = Math.ceil((n - (def.startFrom!=null?def.startFrom:0)) / step);
  const pts = (def.base||0) + units * def.stepPoints;
  return { points:pts, countedQty:n, clamped, errored };
}
function calcLine(proc){
  const m = PROC_BY_CODE[proc.code];
  if(!m) return { points:0, label:proc.code, qty:1, code:proc.code };
  const unitPts = effectivePoints(m);
  let qty = proc.qty || (m.unit==="tooth" ? Math.max(1,(proc.toothIds||[]).length) : 1);
  let points, kizamiInfo=null;
  if(m.kizami){
    const def = Object.assign({}, m.kizami, { stepPoints: (m.kizami.stepPoints!=null? m.kizami.stepPoints : unitPts) });
    const k = kizamiPoints(def, qty);
    points = k.points; kizamiInfo = k;
  } else {
    points = unitPts * qty;
  }
  return { code:m.code, name:m.name, short:m.short, unitPoints:unitPts, qty, points, group:m.group, kizami:kizamiInfo };
}

/* ===========================================================================
   ② 加算適用（通則→基本→注→材料 / base区分で基数決定）
   =========================================================================== */
function calcAddons(record, patient, baseLinesTotal, shoteiPoints){
  const ctx = { age: ageFromBirth(patient?.birth || record.birth, record.visitDate) };
  const isFirst = record.visitType==="first";
  const sorted = ADDON_MASTER.slice().sort((a,b)=>a.order-b.order);
  const applied=[]; let addonPoints=0;
  for(const a of sorted){
    let ok=false;
    try{ ok = a.condition ? a.condition(record, patient, ctx) : false; }catch(e){ ok=false; }
    if(!ok) continue;
    let pts=0;
    if(a.type==="flat"){ pts = isFirst ? (a.points.first||0) : (a.points.recall||0); }
    else if(a.type==="rate"){ const basis = a.base==="shotei" ? shoteiPoints : baseLinesTotal; pts = Math.round(basis*(a.rate||0)); }
    if(pts>0){ addonPoints+=pts; applied.push({ code:a.code, name:a.name, kind:a.kind, points:pts, base:a.base, desc:a.desc }); }
  }
  return { addonPoints, applied };
}

/* ===========================================================================
   ④ 合計点数（処置＋加算）
   =========================================================================== */
function calcRecordPoints(procs, record, patient){
  const lines = (procs||[]).map(calcLine);
  const baseTotal = lines.reduce((s,l)=>s+l.points,0);
  const shoteiLine = lines.find(l=> l.group==="初再診");
  const shotei = shoteiLine ? shoteiLine.points : 0;
  let addon = { addonPoints:0, applied:[] };
  if(record){ addon = calcAddons(record, patient, baseTotal, shotei); }
  const totalPoints = baseTotal + addon.addonPoints;
  return { lines, baseTotalPoints:baseTotal, addonPoints:addon.addonPoints, addonApplied:addon.applied, totalPoints, medicalFee: totalPoints*10 };
}

/* ===========================================================================
   ⑤⑥⑦ 保険→公費→窓口負担（一部負担金は10円未満四捨五入）
   =========================================================================== */
function round10(v){ return Math.round(v/10)*10; }
function calcBurden(record, patient, monthAccum){
  const cp = calcRecordPoints(record.procedures, record, patient);
  const { totalPoints, medicalFee } = cp;
  const b = judgeBurden(record, patient);
  let insuredBurden = round10(medicalFee * b.rate);
  let after = insuredBurden;
  const applied = [];
  const isFirst = record.visitType==="first";
  const kohis = (record.kohi||[]).map(k=>KOHI_BY_LAW[k.law]).filter(Boolean).sort((a,b)=>a.priority-b.priority);
  for(const k of kohis){
    let before = after;
    if(k.method==="none"){ after = 0; }
    else if(k.method==="ratio"){ after = Math.min(after, round10(medicalFee*k.ratio)); }
    else if(k.method==="cap"){ after = Math.min(after, k.monthCap||0); }
    else if(k.method==="dayFlat"){ after = Math.min(after, k.dayAmount||0); }
    else if(k.method==="firstOnly"){ after = isFirst ? Math.min(after, k.firstAmount||0) : 0; }
    applied.push({ law:k.law, name:k.name, from:before, to:after });
  }
  return {
    totalPoints, medicalFee, baseTotalPoints:cp.baseTotalPoints, addonPoints:cp.addonPoints, addonApplied:cp.addonApplied,
    burdenRate:b.rate, burdenBasis:b.basis,
    insuredBurden, kohiApplied:applied, windowBurden: after,
    monthPoints: (monthAccum||0)+totalPoints
  };
}

/* ===========================================================================
   ③ 算定チェック M-13（E/W/I/R）月単位回数・背反・年齢・必須病名
   =========================================================================== */
function runErrorCheck(record){
  const issues = [];
  const procs = record.procedures||[];
  const diseases = record.diseases||[];
  const dxCodes = diseases.map(d=>d.code);
  const findings = record.findings||{};
  const monthCounts = record._monthProcCounts || {};
  const age = ageFromBirth(record.birth, record.visitDate);

  diseases.forEach(d=>{
    const m=DISEASE_BY_CODE[d.code];
    if(m && m.site==="required" && (!d.toothIds||d.toothIds.length===0)){
      issues.push({ level:"E", code:"PART_MISSING", msg:`「${m.name}」は部位必須です。歯式で部位を選択してください。`, goto:"tooth" });
    }
  });
  procs.forEach(p=>{
    const m=PROC_BY_CODE[p.code];
    if(m && m.needDx && !m.needDx.some(dc=>dxCodes.includes(dc))){
      issues.push({ level:"E", code:"DX_MISSING", msg:`「${m.name}」に必要な病名がありません（${m.needDx.map(c=>DISEASE_BY_CODE[c]?.short).join("／")}等）。`, goto:"disease" });
    }
  });
  for(let i=0;i<procs.length;i++){
    const m=PROC_BY_CODE[procs[i].code];
    if(m && m.excl){
      m.excl.forEach(ex=>{ if(procs.some(q=>q.code===ex)) issues.push({ level:"E", code:"EXCL", msg:`「${m.short}」と「${PROC_BY_CODE[ex]?.short}」は同日併算定できません。`, goto:"chart2" }); });
    }
  }
  const dayCnt={};
  procs.forEach(p=>{ dayCnt[p.code]=(dayCnt[p.code]||0)+1; });
  Object.entries(dayCnt).forEach(([c,n])=>{
    const m=PROC_BY_CODE[c];
    if(!m || !m.limit) return;
    if(m.limit.per==="day" && n>m.limit.n){
      issues.push({ level:"E", code:"LIMIT_DAY", msg:`「${m.short}」は1日${m.limit.n}回までです（本日${n}回算定）。`, goto:"chart2" });
    }
    if(m.limit.per==="month"){
      const monthTotal = (monthCounts[c]||0) + n;
      if(monthTotal>m.limit.n){
        issues.push({ level:"E", code:"LIMIT_MONTH", msg:`「${m.short}」は月${m.limit.n}回までです（当月計${monthTotal}回）。`, goto:"chart2" });
      }
    }
  });
  procs.forEach(p=>{
    const m=PROC_BY_CODE[p.code];
    if(m && m.ageMax!=null && age!=null && age>m.ageMax){
      issues.push({ level:"W", code:"AGE", msg:`「${m.short}」は${m.ageMax}歳以下が対象です（${age}歳）。`, goto:"chart2" });
    }
    if(m && m.ageMin!=null && age!=null && age<m.ageMin){
      issues.push({ level:"W", code:"AGE", msg:`「${m.short}」は${m.ageMin}歳以上が対象です（${age}歳）。`, goto:"chart2" });
    }
  });
  procs.forEach(p=>{
    (p.toothIds||[]).forEach(tid=>{
      const f=findings[tid];
      const m=PROC_BY_CODE[p.code];
      if(f && (f.codes||[]).includes("MISSING") && m && m.unit==="tooth" && m.group!=="補綴"){
        issues.push({ level:"W", code:"MISSING_PROC", msg:`欠損歯（${TOOTH_BY_ID[tid]?.label}）に「${m.short}」が算定されています。`, goto:"tooth" });
      }
    });
  });
  if(record.visitType==="first" && !procs.some(p=>p.code==="A000")){
    issues.push({ level:"R", code:"REC_FIRST", msg:"初診の場合、初診料(A000)の算定漏れの可能性があります。", goto:"chart2" });
  }
  procs.forEach(p=>{
    const m=PROC_BY_CODE[p.code];
    if(m && m.surface && (!p.surfaces || p.surfaces.length===0)){
      issues.push({ level:"I", code:"NO_SURFACE", msg:`「${m.short}」の窩洞面が未入力です。`, goto:"surface" });
    }
  });
  if(!MASTER_META.verified && procs.length>0){
    issues.push({ level:"I", code:"MASTER_UNVERIFIED", msg:"点数は要検証の参考値です。確定請求前に支払基金マスタで検証してください。", goto:"chart2" });
  }
  const rank={E:0,W:1,R:2,I:3};
  issues.sort((a,b)=>rank[a.level]-rank[b.level]);
  return issues;
}

    renderQuadrant("permanent","upper","right"),renderQuadrant("permanent","upper","left"),
    renderQuadrant("permanent","lower","right"),renderQuadrant("permanent","lower","left"),
    renderQuadrant("primary","upper","right"),renderQuadrant("primary","upper","left"),
    renderQuadrant("primary","lower","right"),renderQuadrant("primary","lower","left"));
}

/* ===========================================================================
   歯式UI（SCR-010）：状態レイヤ・選択単位・操作モード・Undo
   props: findings, setFindings(updater), selectedIds, setSelectedIds, readOnly, onAudit
   =========================================================================== */
const SELECT_UNITS=[
  {key:"single",label:"1歯"},{key:"upper",label:"上顎"},{key:"lower",label:"下顎"},
  {key:"all",label:"全顎"},{key:"upperMissing",label:"上顎欠損"},{key:"lowerMissing",label:"下顎欠損"}
];
const MODES=[
  {key:"normal",label:"通常選択",hint:"タップで選択／再タップ解除"},
  {key:"missing",label:"欠損登録",hint:"対象歯タップで欠損⇔解除"},
  {key:"root",label:"残根登録",hint:"対象歯を残根状態へ"},
  {key:"split",label:"歯根分割",hint:"対象歯の根数を指定"},
  {key:"bridge",label:"Br入力",hint:"支台○→Pon→隙▲を連続入力"}
];
function ToothPanel({findings, setFindings, selectedIds, setSelectedIds, readOnly, onAudit, flagIds}){
  const [unit,setUnit]=useState("single");
  const [mode,setMode]=useState("normal");
  const [excludeMissing,setExcludeMissing]=useState(true);
  const [activeLayer,setActiveLayer]=useState("caries");
  const [undoStack,setUndoStack]=useState([]);
  const [splitFor,setSplitFor]=useState(null);
  const [noteFor,setNoteFor]=useState(null);
  const [bridgeStep,setBridgeStep]=useState("BR"); // BR→PON→GAP cycle

  const pushUndo = () => setUndoStack(s=>[...s.slice(-19), JSON.stringify(findings)]);
  const undo = () => { setUndoStack(s=>{ if(!s.length) return s; const prev=s[s.length-1]; setFindings(()=>JSON.parse(prev)); return s.slice(0,-1); }); };

  const teethOfUnit = useCallback((tid)=>{
    if(unit==="single") return [tid].filter(Boolean);
    const isMiss=t=> (findings[t.id]?.codes||[]).includes("MISSING");
    let pool=ALL_TEETH.filter(t=>t.dentition==="permanent");
    if(unit==="upper") pool=pool.filter(t=>t.jaw==="upper");
    else if(unit==="lower") pool=pool.filter(t=>t.jaw==="lower");
    else if(unit==="upperMissing") pool=pool.filter(t=>t.jaw==="upper"&&isMiss(t));
    else if(unit==="lowerMissing") pool=pool.filter(t=>t.jaw==="lower"&&isMiss(t));
    if(excludeMissing && unit!=="upperMissing" && unit!=="lowerMissing") pool=pool.filter(t=>!isMiss(t));
    return pool.map(t=>t.id);
  },[unit,excludeMissing,findings]);

  const applyStatus = (code) => {
    if(readOnly||!selectedIds.length) return;
    pushUndo();
    const def=STATUS_BY_CODE[code];
    setFindings(fs=>{
      const next={...fs};
      selectedIds.forEach(tid=>{
        const cur=next[tid]?{...next[tid],codes:[...(next[tid].codes||[])]}:{codes:[]};
        // 同レイヤの既存コードを置換（複数レイヤは共存）
        cur.codes=cur.codes.filter(c=>STATUS_BY_CODE[c]?.layer!==def.layer);
        if(code!=="SOUND") cur.codes.push(code);
        next[tid]=cur;
      });
      return next;
    });
    onAudit && onAudit("歯牙状態変更", `${selectedIds.length}歯 ← ${def.name}`);
  };
  const clearTooth=(tid)=>{ if(readOnly) return; pushUndo(); setFindings(fs=>{ const n={...fs}; delete n[tid]; return n; }); };

  const onToothTap=(tid,e)=>{
    if(tid===null){ if(unit==="single") setSelectedIds([]); return; }
    if(readOnly){ setSelectedIds([tid]); return; }
    if(mode==="missing"){ pushUndo(); toggleLayerCode(tid,"MISSING"); onAudit&&onAudit("歯牙状態変更",`${TOOTH_BY_ID[tid].label} 欠損トグル`); return; }
    if(mode==="root"){ pushUndo(); setLayerCode(tid,"ROOT"); onAudit&&onAudit("歯牙状態変更",`${TOOTH_BY_ID[tid].label} 残根`); return; }
    if(mode==="split"){ setSplitFor(tid); return; }
    if(mode==="bridge"){ pushUndo(); cycleBridge(tid); return; }
    // 通常選択
    if(unit==="single"){
      setSelectedIds(ids=>ids.includes(tid)?ids.filter(x=>x!==tid):[...ids,tid]);
    } else {
      setSelectedIds(teethOfUnit(tid));
    }
  };
  const setLayerCode=(tid,code)=>{ const def=STATUS_BY_CODE[code]; setFindings(fs=>{ const n={...fs}; const cur=n[tid]?{...n[tid],codes:[...(n[tid].codes||[])]}:{codes:[]}; cur.codes=cur.codes.filter(c=>STATUS_BY_CODE[c]?.layer!==def.layer); cur.codes.push(code); n[tid]=cur; return n; }); };
  const toggleLayerCode=(tid,code)=>{ setFindings(fs=>{ const n={...fs}; const cur=n[tid]?{...n[tid],codes:[...(n[tid].codes||[])]}:{codes:[]}; if(cur.codes.includes(code)) cur.codes=cur.codes.filter(c=>c!==code); else { cur.codes=cur.codes.filter(c=>STATUS_BY_CODE[c]?.layer!==STATUS_BY_CODE[code].layer); cur.codes.push(code); } n[tid]=cur; return n; }); };
  const cycleBridge=(tid)=>{ const order=["BR","PON","GAP"]; setLayerCode(tid,bridgeStep); const i=order.indexOf(bridgeStep); setBridgeStep(order[(i+1)%order.length]); };
  const confirmSplit=(roots)=>{ if(splitFor){ pushUndo(); setFindings(fs=>{ const n={...fs}; const cur=n[splitFor]?{...n[splitFor]}:{}; cur.codes=[...new Set([...(cur.codes||[]).filter(c=>STATUS_BY_CODE[c]?.layer!=="defect"),"SPLIT"])]; cur.roots=roots; n[splitFor]=cur; return n; }); onAudit&&onAudit("歯牙状態変更",`${TOOTH_BY_ID[splitFor].label} 歯根分割 ${roots}根`); } setSplitFor(null); };
  const saveNote=(text)=>{ if(noteFor!=null){ pushUndo(); setFindings(fs=>{ const n={...fs}; const cur=n[noteFor]?{...n[noteFor]}:{codes:[]}; cur.note=text; n[noteFor]=cur; return n; }); } setNoteFor(null); };

  const selectedLabels = selectedIds.map(id=>TOOTH_BY_ID[id]?.label).filter(Boolean);
  const cat = STATUS_CATEGORIES.find(c=>c.layer===activeLayer) || STATUS_CATEGORIES[0];

  return h("div",null,
    // 選択単位
    h("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}},
      SELECT_UNITS.map(u=>h(Btn,{key:u.key,variant:unit===u.key?"primary":"subtle",onClick:()=>{setUnit(u.key); if(u.key!=="single") setSelectedIds([]);},style:{padding:"7px 11px",fontSize:12.5}},u.label)),
      h("label",{style:{display:"flex",alignItems:"center",gap:5,fontSize:12,color:C.sub,marginLeft:4}},
        h("input",{type:"checkbox",checked:excludeMissing,onChange:e=>setExcludeMissing(e.target.checked)}),"欠損歯を除外")),
    // モード
    h("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:6}},
      MODES.map(m=>h(Btn,{key:m.key,variant:mode===m.key?"dark":"subtle",onClick:()=>setMode(m.key),disabled:readOnly,style:{padding:"7px 11px",fontSize:12.5}},m.label))),
    h("div",{style:{fontSize:11.5,color:C.sub,marginBottom:8}}, "モード操作: ", MODES.find(m=>m.key===mode)?.hint, mode==="bridge"?`（次の入力: ${STATUS_BY_CODE[bridgeStep].abbr}）`:""),
    // 選択中表示 + Undo
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"8px 12px",background:"#f7fafc",border:"1px solid "+C.line,borderRadius:9,marginBottom:10,flexWrap:"wrap"}},
      h("div",{style:{fontSize:12.5,color:C.ink}}, selectedIds.length? h(F,null,"選択中：",h("b",null,selectedLabels.join("、"))," ",h("span",{style:{color:C.sub}},`（${selectedIds.length}歯）`)) : h("span",{style:{color:C.sub}},"歯をタップして選択してください。")),
      h("div",{style:{display:"flex",gap:6}},
        h(Btn,{variant:"subtle",onClick:undo,disabled:!undoStack.length,style:{padding:"6px 10px",fontSize:12}},"↩ 取消(Undo)"),
        selectedIds.length>0 && h(Btn,{variant:"subtle",onClick:()=>setSelectedIds([]),style:{padding:"6px 10px",fontSize:12}},"選択解除"))),
    // アーチ + 状態パッド
    h("div",{style:{display:"grid",gridTemplateColumns:"minmax(0,1.25fr) minmax(0,1fr)",gap:14,alignItems:"start"}},
      h("div",{style:{border:"1px solid "+C.line,borderRadius:12,padding:8,background:"#fcfdfe"}},
        h(DentalArch,{findings,selectedIds,onToothTap,flagIds})),
      h("div",null,
        h("div",{style:{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}},
          STATUS_CATEGORIES.map(c=>h(Btn,{key:c.label,variant:activeLayer===c.layer?"primary":"subtle",onClick:()=>setActiveLayer(c.layer),style:{padding:"6px 10px",fontSize:12}},c.label))),
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(82px,1fr))",gap:7}},
          cat.codes.map(code=>{ const s=STATUS_BY_CODE[code]; return h("button",{key:code,disabled:readOnly||!selectedIds.length,onClick:()=>applyStatus(code),
            style:{minHeight:48,borderRadius:10,border:"1px solid "+(s.color==="#ffffff"?C.line:s.color),background:s.color,color:s.textColor,fontWeight:800,fontSize:12,cursor:(readOnly||!selectedIds.length)?"not-allowed":"pointer",opacity:(readOnly||!selectedIds.length)?0.5:1,padding:"4px 2px"}},
            s.abbr); })),
        selectedIds.length===1 && h("div",{style:{marginTop:10,display:"flex",gap:6,flexWrap:"wrap"}},
          h(Btn,{variant:"ghost",onClick:()=>setNoteFor(selectedIds[0]),disabled:readOnly,style:{padding:"7px 10px",fontSize:12}},"＊ 自由記載"),
          h(Btn,{variant:"danger",onClick:()=>clearTooth(selectedIds[0]),disabled:readOnly,style:{padding:"7px 10px",fontSize:12}},"この歯をクリア")),
        h("div",{style:{marginTop:12,fontSize:11,color:"#9aa6b0",lineHeight:1.6}},
          "色＝状態。略記で白黒印刷でも判別可。右上の青丸＝複数状態あり。外周リング＝歯周処置。")
      )),
    // 分割根数ダイアログ
    h(Modal,{open:!!splitFor,onClose:()=>setSplitFor(null),title:"歯根分割：根数を指定",maxW:360},
      h("div",{style:{display:"flex",gap:8,justifyContent:"center"}},
        [1,2,3,4].map(n=>h(Btn,{key:n,variant:"subtle",onClick:()=>confirmSplit(n),style:{minWidth:56}},n+"根")))),
    // 自由記載ダイアログ
    h(NoteDialog,{toothId:noteFor,findings,onClose:()=>setNoteFor(null),onSave:saveNote})
  );
}
function NoteDialog({toothId, findings, onClose, onSave}){
  const [v,setV]=useState("");
  useEffect(()=>{ if(toothId!=null) setV(findings[toothId]?.note||""); },[toothId]);
  if(toothId==null) return null;
  return h(Modal,{open:true,onClose,title:`自由記載：${TOOTH_BY_ID[toothId]?.label}`,maxW:420,
    footer:h(F,null,h(Btn,{variant:"subtle",onClick:onClose},"キャンセル"),h(Btn,{variant:"primary",onClick:()=>onSave(v)},"保存"))},
    h(Textarea,{value:v,onChange:e=>setV(e.target.value),placeholder:"この歯に紐づくメモを入力"}));
}

    ));

/* ===========================================================================
   病名入力（SCR-011）— 文脈依存表示・移行病名・併記病名
   diseases: [{ id, code, toothIds:[], state:"継続"|"治癒", trans:null, co:[] }]
   =========================================================================== */
function DiseasePanel({record, onChange, readOnly, selectedIds}){
  const diseases=record.diseases||[];
  const findings=record.findings||{};
  const [q,setQ]=useState("");
  const hasSel=selectedIds.length>0;
  const hasMissingSel=selectedIds.some(id=>(findings[id]?.codes||[]).includes("MISSING")||(findings[id]?.codes||[]).includes("ROOT"));
  // 文脈に応じた優先表示
  const ranked=useMemo(()=>{
    let list=[...DISEASE_MASTER];
    const score=d=>{
      let s=0;
      if(!hasSel){ if(d.site==="none"||d.site==="arch") s+=3; }
      else { if(d.site==="required") s+=3; }
      if(hasMissingSel && ["D-MT"].includes(d.code)) s+=4;
      if(record.visitType==="first" && d.category==="caries") s+=1;
      if(q && (d.name.includes(q)||d.short.includes(q))) s+=5;
      return s;
    };
    return list.map(d=>({d,s:score(d)})).sort((a,b)=>b.s-a.s).map(x=>x.d).filter(d=>!q||d.name.includes(q)||d.short.includes(q));
  },[q,hasSel,hasMissingSel,record.visitType]);

  const addDisease=(code)=>{
    if(readOnly) return;
    const m=DISEASE_BY_CODE[code];
    const dx={ id:uid(), code, toothIds:(m.site!=="none"?[...selectedIds]:[]), state:"継続", co:[] };
    onChange({...record, diseases:[...diseases, dx]});
  };
  const removeDx=id=>onChange({...record, diseases:diseases.filter(d=>d.id!==id)});
  const setDxField=(id,k,v)=>onChange({...record, diseases:diseases.map(d=>d.id===id?{...d,[k]:v}:d)});
  const doTransition=(id)=>{ // 移行病名（移行元を「移行済」に、移行先を追加）
    const dx=diseases.find(d=>d.id===id); const m=DISEASE_BY_CODE[dx.code];
    if(!m.trans) return;
    const newDx={ id:uid(), code:m.trans, toothIds:[...(dx.toothIds||[])], state:"継続", co:[], fromTransition:dx.code };
    onChange({...record, diseases:diseases.map(d=>d.id===id?{...d,state:"移行済"}:d).concat([newDx])});
  };

  return h("div",null,
    h("div",{style:{display:"flex",gap:8,marginBottom:8,alignItems:"center",flexWrap:"wrap"}},
      h(Input,{value:q,onChange:e=>setQ(e.target.value),placeholder:"病名を検索（名称・略称）",style:{maxWidth:280}}),
      h("span",{style:{fontSize:11.5,color:C.sub}}, hasSel?`選択部位（${selectedIds.length}歯）に病名を付与`:"部位未選択 → 歯式外・全顎病名を優先表示")),
    h("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}},
      ranked.slice(0,12).map(d=>h(Btn,{key:d.code,variant:"subtle",onClick:()=>addDisease(d.code),disabled:readOnly,style:{padding:"7px 11px",fontSize:12.5}},
        d.short," ",h("span",{style:{color:C.sub,fontWeight:500}},`(${d.name})`)))),
    h("div",{style:{fontSize:12,fontWeight:700,color:C.sub,marginBottom:6}},"登録済み傷病"),
    diseases.length===0 ? h("div",{style:{fontSize:12.5,color:C.sub,padding:"8px 0"}},"傷病が未登録です。") :
    h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
      diseases.map(dx=>{ const m=DISEASE_BY_CODE[dx.code]; const labels=(dx.toothIds||[]).map(id=>TOOTH_BY_ID[id]?.label).join("、");
        return h("div",{key:dx.id,style:{border:"1px solid "+C.line,borderRadius:10,padding:"10px 12px",background:dx.state==="移行済"?"#f8f9fa":"#fff"}},
          h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}},
            h("div",null,
              h("span",{style:{fontWeight:800,color:C.ink,fontSize:14}}, m?.name||dx.code),
              dx.fromTransition&&h(Badge,{color:"#5f3dc4",bg:"#f3f0ff",border:"#d0bfff"},"移行先"),
              dx.state==="移行済"&&h(Badge,{color:"#868e96",bg:"#f1f3f5"},"移行済"),
              labels&&h("span",{style:{fontSize:12,color:C.sub,marginLeft:8}},"部位: "+labels)),
            h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
              !readOnly&&m?.trans&&dx.state!=="移行済"&&h(Btn,{variant:"ghost",onClick:()=>doTransition(dx.id),style:{padding:"5px 9px",fontSize:11.5}},`→ ${DISEASE_BY_CODE[m.trans]?.short}へ移行`),
              !readOnly&&h(Select,{value:dx.state,onChange:e=>setDxField(dx.id,"state",e.target.value),style:{minHeight:36,padding:"4px 8px",fontSize:12,width:"auto"},options:[{value:"継続",label:"継続"},{value:"治癒",label:"治癒"},{value:"中止",label:"中止"},{value:"移行済",label:"移行済"}]}),
              !readOnly&&h(Btn,{variant:"danger",onClick:()=>removeDx(dx.id),style:{padding:"5px 9px",fontSize:11.5}},"削除"))),
          // 併記病名
          m?.co && dx.state!=="移行済" && h("div",{style:{marginTop:6,fontSize:11.5,color:C.sub}},"併記候補: ",
            m.co.map(cc=>h(Btn,{key:cc,variant:"subtle",onClick:()=>!readOnly&&addDisease(cc),disabled:readOnly,style:{padding:"3px 8px",fontSize:11,marginLeft:4}},DISEASE_BY_CODE[cc]?.short)))); })));
}

   procedures: [{ id, code, toothIds:[], surfaces:[], qty }]

const FUNCTION_KEYS=[
  ["F1","傷病繰越"],["F2","傷病登録"],["F5","口腔情報"],["F6","エラー表示"],
  ["F7","カルテ2号"],["F12","カルテ記入"]
];
function ProcedurePanel({record, onChange, readOnly, selectedIds, onGoto, onFunc}){
  const procs=record.procedures||[];
  const diseases=record.diseases||[];
  const dxCodes=diseases.map(d=>d.code);
  const [tab,setTab]=useState("set"); // set | search
  const [q,setQ]=useState("");
  // 病名に紐づく処置セット
  const activeSets=useMemo(()=>{
    const setIds=new Set();
    diseases.forEach(d=>{ const m=DISEASE_BY_CODE[d.code]; (m?.sets||[]).forEach(s=>setIds.add(s)); });
    return [...setIds].map(id=>({id,...PROC_SETS[id]})).filter(s=>s.label);
  },[diseases]);
  const addProc=(code)=>{
    if(readOnly) return;
    const m=PROC_BY_CODE[code];
    const p={ id:uid(), code, toothIds:(m.unit==="tooth"?[...selectedIds]:[]), surfaces:[], qty:(m.unit==="tooth"?Math.max(1,selectedIds.length):1) };
    // 算定処置に基づき歯式へ処置色を反映（yields）
    let nextFindings=record.findings;
    if(m.yields && selectedIds.length){ nextFindings={...record.findings}; selectedIds.forEach(tid=>{ const cur=nextFindings[tid]?{...nextFindings[tid],codes:[...(nextFindings[tid].codes||[])]}:{codes:[]}; const lay=STATUS_BY_CODE[m.yields].layer; cur.codes=cur.codes.filter(c=>STATUS_BY_CODE[c]?.layer!==lay); cur.codes.push(m.yields); nextFindings[tid]=cur; }); }
    onChange({...record, procedures:[...procs,p], findings:nextFindings});
  };
  const removeProc=id=>onChange({...record, procedures:procs.filter(p=>p.id!==id)});
  const searchResults=PROC_MASTER.filter(p=>!q || p.name.includes(q)||p.short.includes(q)||(p.points+"").includes(q)).slice(0,20);
  const { lines, totalPoints, baseTotalPoints, addonPoints, addonApplied } = calcRecordPoints(procs, record, null);

  return h("div",null,
    // ファンクション
    h("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10,paddingBottom:10,borderBottom:"1px dashed "+C.line}},
      FUNCTION_KEYS.map(([k,label])=>h(Btn,{key:k,variant:"subtle",onClick:()=>onFunc&&onFunc(k),style:{padding:"6px 10px",fontSize:11.5}},
        h("span",{style:{color:C.accent,fontWeight:800}},k)," ",label))),
    h("div",{style:{display:"flex",gap:8,marginBottom:10}},
      h(Btn,{variant:tab==="set"?"primary":"subtle",onClick:()=>setTab("set"),style:{padding:"7px 12px",fontSize:12.5}},"処置セット"),
      h(Btn,{variant:tab==="search"?"primary":"subtle",onClick:()=>setTab("search"),style:{padding:"7px 12px",fontSize:12.5}},"名称・点数検索")),
    tab==="set" ? h("div",null,
      activeSets.length===0 ? h("div",{style:{fontSize:12.5,color:C.sub,padding:"6px 0"}},"病名を登録すると対応する処置セットが表示されます。") :
      activeSets.map(s=>h("div",{key:s.id,style:{marginBottom:12}},
        h("div",{style:{fontSize:12.5,fontWeight:800,color:C.ink,marginBottom:5}},s.label),
        h("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
          s.items.map(it=>{ const m=PROC_BY_CODE[it.code]; if(!m) return null; return h(Btn,{key:it.code,variant:it.auto==="auto"?"ghost":"subtle",onClick:()=>addProc(it.code),disabled:readOnly,style:{padding:"7px 11px",fontSize:12.5}},
            m.short," ",h("span",{style:{color:C.accent,fontWeight:700}},m.points+"点"), it.auto==="auto"&&h("span",{style:{fontSize:10,color:C.ok,marginLeft:4}},"自動")); })))) )
    : h("div",null,
      h(Input,{value:q,onChange:e=>setQ(e.target.value),placeholder:"処置名・点数で検索",style:{marginBottom:8}}),
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
        searchResults.map(m=>h(Btn,{key:m.code,variant:"subtle",onClick:()=>addProc(m.code),disabled:readOnly,style:{padding:"7px 11px",fontSize:12}},
          m.short," ",h("span",{style:{color:C.accent,fontWeight:700}},m.points+"点"))))),
    // 算定処置一覧
    h("div",{style:{marginTop:14}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}},
        h("div",{style:{fontSize:12,fontWeight:700,color:C.sub}},"算定処置一覧"),
        h(Badge,{color:C.accent,bg:"#e6fcf5"},`仮計 ${totalPoints}点 / ${yen(totalPoints*10)}`)),
      procs.length===0 ? h("div",{style:{fontSize:12.5,color:C.sub,padding:"6px 0"}},"算定処置がありません。") :
      h("div",{style:{display:"flex",flexDirection:"column",gap:7}},
        procs.map(p=>{ const m=PROC_BY_CODE[p.code]; const line=calcLine(p); const labels=(p.toothIds||[]).map(id=>TOOTH_BY_ID[id]?.label).join("、");
          return h("div",{key:p.id,style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,border:"1px solid "+C.line,borderRadius:10,padding:"9px 12px",flexWrap:"wrap"}},
            h("div",null,
              h("span",{style:{fontWeight:700,color:C.ink,fontSize:13.5}},m?.name),
              h("span",{style:{fontSize:11,color:C.sub,marginLeft:8}},`${line.unitPoints}点 × ${line.qty}`),
              labels&&h("div",{style:{fontSize:11.5,color:C.sub,marginTop:2}},"部位: "+labels),
              m?.surface&&h("div",{style:{fontSize:11.5,color:(p.surfaces&&p.surfaces.length)?C.ok:C.warn,marginTop:2}},
                "窩洞面: "+((p.surfaces&&p.surfaces.length)?p.surfaces.join("・"):"未入力")," ",
                !readOnly&&h(Btn,{variant:"ghost",onClick:()=>onGoto&&onGoto("surface",p.id),style:{padding:"2px 8px",fontSize:11,marginLeft:4}},"窩洞面入力"))),
            h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
              h("b",{style:{color:C.accent,fontSize:14}},line.points+"点"),
              !readOnly&&h(Btn,{variant:"danger",onClick:()=>removeProc(p.id),style:{padding:"4px 9px",fontSize:11.5}},"削除"))); }))));
}

/* ===========================================================================
   カルテ2号（SCR-015）— 診療内容表示・修正・二本線訂正・論理削除・再計算
   chartLines は procedures + diseases から自動生成し、確定後は版管理する
   =========================================================================== */
function Chart2Panel({record, patient, onChange, readOnly, monthAccum}){
  const procs=(record.procedures||[]);
  const diseases=(record.diseases||[]);
  const corrections=record.corrections||{};   // {procId:{struck:bool, reason}}
  // 二本線訂正（論理削除）された処置は点数計算から除外する
  const effectiveProcs=(record.procedures||[]).filter(p=>!(corrections[p.id]&&corrections[p.id].struck));
  const calc=calcBurden({...record, procedures:effectiveProcs}, patient, monthAccum);
  const prevCalc=record._prevCalc;             // 再計算前の控え
  const strikeProc=(id,reason)=>{ if(readOnly) return; onChange({...record, corrections:{...corrections,[id]:{struck:true,reason,by:null,at:nowISO()}}}); };
  const unstrike=id=>{ const c={...corrections}; delete c[id]; onChange({...record, corrections:c}); };
  const recalc=()=>{ onChange({...record, _prevCalc:{totalPoints:calc.totalPoints, windowBurden:calc.windowBurden, at:nowISO()}, _recalcAt:nowISO()}); };

  return h("div",null,
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}},
      h("div",{style:{fontSize:13,fontWeight:800,color:C.ink}},"診療内容（2号用紙相当）"),

/* ===========================================================================
   点数マスタ管理（SCR-018 相当 / 管理者）
   ・処置ごとの所定点数を上書き（OVERRIDE）。確定値への差し替え経路。
   ・CSV取込：支払基金 基本マスター想定（Shift_JIS対応）。
     列マッピングは「診療行為コード(9桁/recode) または 内部code, 点数」を最小要件とする。
   =========================================================================== */
function PointMasterPanel({open, onClose}){
  if(!open) return null;
  const [, force] = useState(0);
  const ov = loadOverride();
  const [status,setStatus]=useState("");
  const setOne=(code,val)=>{ const o=loadOverride(); if(val===""||val==null){ delete o[code]; } else { o[code]=+val; } saveOverride(o); force(x=>x+1); };
  const resetAll=()=>{ if(confirm("全ての点数上書きを削除し、内蔵参考値へ戻します。よろしいですか？")){ saveOverride({}); force(x=>x+1); setStatus("上書きを全削除しました。"); } };

  const onCSV=(file)=>{
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const text=reader.result;
        const rows=String(text).split(/\r\n|\r|\n/).filter(l=>l.trim()!=="");
        const byRecode={}; PROC_MASTER.forEach(p=>{ if(p.recode) byRecode[p.recode]=p.code; });
        const o=loadOverride();
        let hit=0, miss=0;
        rows.forEach(line=>{
          const cols=line.split(",").map(c=>c.replace(/^"|"$/g,"").trim());
          if(cols.length<2) return;
          // 「コード, …, 点数」想定：先頭をコード、数値で最初に妥当な点数列を探す
          const key=cols[0].replace(/^0+/,"")||cols[0]; // 前ゼロ省略
          let code=null;
          if(PROC_BY_CODE[cols[0]]) code=cols[0];
          else if(byRecode[cols[0]]) code=byRecode[cols[0]];
          else { // recodeの前ゼロ違いを許容
            const k2=Object.keys(byRecode).find(rc=>rc.replace(/^0+/,"")===key);
            if(k2) code=byRecode[k2];
          }
          if(!code){ miss++; return; }
          // 点数列：2列目以降で整数として妥当な最大列を採用（簡易）
          let pts=null;
          for(let i=1;i<cols.length;i++){ const n=+cols[i]; if(!isNaN(n)&&n>0&&n<100000){ pts=n; break; } }
          if(pts==null){ miss++; return; }
          o[code]=pts; hit++;
        });
        saveOverride(o); force(x=>x+1);
        setStatus(`取込完了：${hit}件を更新${miss>0?`（${miss}件は内蔵マスタに該当コードなしでスキップ）`:""}。`);
        pushAudit({type:"点数マスタ取込",detail:`更新${hit}件/スキップ${miss}件`});
      }catch(e){ setStatus("取込エラー: "+(e&&e.message||e)); }
    };
    reader.onerror=()=>setStatus("ファイル読込に失敗しました。");
    // 支払基金マスタはShift_JIS。可能なら Shift_JIS で読む
    try{ reader.readAsText(file, "Shift_JIS"); }catch(e){ reader.readAsText(file); }
  };

  return h(Modal,{open:true,onClose,title:"点数マスタ管理（管理者）",maxW:860},
    h("div",{style:{fontSize:12.5,color:"#a8480c",background:"#fff4e6",border:"1px solid #ffd8a8",borderRadius:9,padding:"10px 12px",marginBottom:12}},
      "内蔵点数は要検証の参考値（",MASTER_META.rev,"）です。支払基金 基本マスター／電子点数表のCSVを取り込み、確定値へ差し替えてください。最終的な算定責任は医療機関にあります。"),
    h("div",{style:{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12,alignItems:"center"}},
      h("label",{style:{display:"inline-flex",alignItems:"center",gap:8,padding:"8px 12px",border:"1px solid "+C.line,borderRadius:9,cursor:"pointer",fontSize:13}},
        "CSV取込（支払基金マスタ / Shift_JIS可）",
        h("input",{type:"file",accept:".csv,text/csv",style:{display:"none"},onChange:e=>onCSV(e.target.files&&e.target.files[0])})),
      h(Btn,{variant:"subtle",onClick:resetAll,style:{padding:"7px 12px",fontSize:12.5}},"上書きを全削除")),
    status && h("div",{style:{fontSize:12.5,color:C.accent,marginBottom:10}},status),
    h("div",{style:{maxHeight:"52vh",overflow:"auto",border:"1px solid "+C.line,borderRadius:10}},
      h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:12.5}},
        h("thead",null,h("tr",{style:{background:"#f7fafc",position:"sticky",top:0}},
          ["コード","レセ電","名称","内蔵値","適用点数","上書き"].map((th,i)=>h("td",{key:i,style:{padding:"7px 9px",fontWeight:700,color:C.sub,borderBottom:"1px solid "+C.line}},th)))),
        h("tbody",null,PROC_MASTER.map(m=>{ const cur=ov[m.code]; const eff=effectivePoints(m); return h("tr",{key:m.code},
          h("td",{style:{padding:"5px 9px",borderBottom:"1px solid #eef2f5",fontFamily:"monospace"}},m.code),
          h("td",{style:{padding:"5px 9px",borderBottom:"1px solid #eef2f5",fontFamily:"monospace",color:C.sub}},m.recode||"—"),
          h("td",{style:{padding:"5px 9px",borderBottom:"1px solid #eef2f5"}},m.name),
          h("td",{style:{padding:"5px 9px",borderBottom:"1px solid #eef2f5",textAlign:"right",color:C.sub}},m.points),
          h("td",{style:{padding:"5px 9px",borderBottom:"1px solid #eef2f5",textAlign:"right",fontWeight:700,color:cur!=null?C.accent:C.ink}},eff+(cur!=null?" *":"")),
          h("td",{style:{padding:"5px 9px",borderBottom:"1px solid #eef2f5",textAlign:"right"}},
            h("input",{type:"number",value:cur!=null?cur:"",placeholder:"—",onChange:e=>setOne(m.code,e.target.value),
              style:{width:84,padding:"5px 7px",border:"1px solid "+C.line,borderRadius:7,fontSize:12.5,textAlign:"right"}}))); }))) ),
    h("div",{style:{fontSize:11.5,color:C.sub,marginTop:10}},"「*」は上書き適用中。上書きは端末内（localStorage）に保存され、計算に即時反映されます。"));
}
/* ===========================================================================
   Workspace — 統合ワークスペース（標準入力フロー §4.2）
   タブ: 頭書き → 歯式 → 病名 → 処置 → 歯周 → SOAP → カルテ2号 → エラー → レセプト
   =========================================================================== */
const TABS=[
  {key:"header",label:"頭書き・保険",scr:"SCR-006/007"},
  {key:"tooth",label:"歯式",scr:"SCR-010"},
  {key:"disease",label:"病名",scr:"SCR-011"},
  {key:"proc",label:"処置",scr:"SCR-009"},
  {key:"perio",label:"歯周検査",scr:"SCR-013"},
  {key:"soap",label:"SOAP",scr:"SCR-014"},
  {key:"chart2",label:"カルテ2号",scr:"SCR-015"},
  {key:"error",label:"エラーチェック",scr:"SCR-016"},
  {key:"receipt",label:"レセプト連携",scr:"SCR-017"}
];
function Workspace({initialRecord, patient, user, onSave, onBack, records}){
  const [record,setRecord]=useState(initialRecord);
  const [tab,setTab]=useState("header");
  const [selectedIds,setSelectedIds]=useState([]);
  const [savedAt,setSavedAt]=useState(null);
  const [surfaceFor,setSurfaceFor]=useState(null);
  const [finalizeOpen,setFinalizeOpen]=useState(false);
  const [amendOpen,setAmendOpen]=useState(false);
  const [histOpen,setHistOpen]=useState(false);
  const [printOpen,setPrintOpen]=useState(false);
  const dirty=useRef(false);

  const isFinalized=record.status==="finalized"||record.status==="amended";
  const editClinical=canEditClinical(user);
  const readOnly=(isFinalized && !record._amending) || !editClinical;

  // 当月累計（同患者・確定済みの当月分）
  const monthAccum=useMemo(()=>{
    const ym=ymOf(record.visitDate);
    return (records||[]).filter(r=>r.patientId===record.patientId && r.id!==record.id && (r.status==="finalized"||r.status==="amended") && ymOf(r.visitDate)===ym)
      .reduce((s,r)=>s+calcRecordPoints(r.procedures, r, patient).totalPoints,0);
  },[records,record.patientId,record.visitDate]);

  // 当月の処置別算定回数（同患者・確定済みの当月分）— 月回数限度チェック用
  const monthProcCounts=useMemo(()=>{
    const ym=ymOf(record.visitDate); const cnt={};
    (records||[]).filter(r=>r.patientId===record.patientId && r.id!==record.id && (r.status==="finalized"||r.status==="amended") && ymOf(r.visitDate)===ym)
      .forEach(r=>(r.procedures||[]).forEach(p=>{ cnt[p.code]=(cnt[p.code]||0)+1; }));
    return cnt;
  },[records,record.patientId,record.visitDate]);

  const issues=useMemo(()=>runErrorCheck({...record,_monthProcCounts:monthProcCounts}),[record,monthProcCounts]);
  const errCount=issues.filter(i=>i.level==="E").length;

  // 自動保存（NFR-005）
  useEffect(()=>{ if(!dirty.current) return; const t=setTimeout(()=>{ const upd={...record,updatedAt:nowISO()}; onSave(upd,{silent:true}); setSavedAt(nowISO()); dirty.current=false; },1200); return ()=>clearTimeout(t); },[record]);

  const change=next=>{ dirty.current=true; setRecord(next); };
  const setFindings=updater=>{ dirty.current=true; setRecord(r=>({...r,findings:typeof updater==="function"?updater(r.findings||{}):updater})); };
  const audit=(type,detail)=>pushAudit({type,detail,user:user.name,patient:record.name});

  const saveDraft=()=>{ const upd={...record,updatedAt:nowISO()}; onSave(upd); setSavedAt(nowISO()); dirty.current=false; audit("下書き保存",""); };
  const doFinalize=()=>{ const now=nowISO(); const upd={...record,status:"finalized",version:1,finalizedByName:user.name,finalizedById:user.id,finalizedAt:now,updatedAt:now,
    history:[...(record.history||[]),{action:"確定",userName:user.name,at:now,version:1}]}; setRecord(upd); onSave(upd); setFinalizeOpen(false); audit("診療録確定","v1"); };
  const startAmend=reason=>{ setRecord({...record,_amending:true,_amendReason:reason}); setAmendOpen(false); audit("訂正開始",reason); };
  const commitAmend=()=>{ const now=nowISO(); const ver=(record.version||1)+1; const upd={...record,status:"amended",version:ver,_amending:false,amendedByName:user.name,amendedAt:now,updatedAt:now,
    history:[...(record.history||[]),{action:"訂正",userName:user.name,at:now,version:ver,reason:record._amendReason}],_amendReason:undefined}; setRecord(upd); onSave(upd); audit("訂正確定","v"+ver); };

  const gotoFix=(target,procId)=>{ if(target==="surface"){ if(procId) setSurfaceFor(record.procedures.find(p=>p.id===procId)); setTab("proc"); return; } setTab(target); };
  const onFunc=k=>{ if(k==="F7") setTab("chart2"); else if(k==="F6") setTab("error"); else if(k==="F12") setTab("chart2"); else if(k==="F5") setTab("tooth"); else if(k==="F2"||k==="F1") setTab("disease"); };

  return h("div",{style:{maxWidth:1040,margin:"0 auto",padding:"14px 12px 90px"}},
    h(AppBar,{user,title:"診療録（統合版）",onLogout:onBack,
      left:h(Btn,{variant:"subtle",onClick:onBack,style:{padding:"6px 11px",fontSize:12}},"← 患者一覧"),
      right:errCount>0&&h(Badge,{color:"#fff",bg:"#c92a2a"},`E ${errCount}`)}),
    // 患者バー
    h("div",{style:{display:"flex",flexWrap:"wrap",gap:10,alignItems:"center",justifyContent:"space-between",margin:"12px 0",padding:"11px 16px",background:"#fff",border:"1px solid "+C.line,borderRadius:12}},
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h("div",null,h("div",{style:{fontSize:16,fontWeight:800,color:C.ink}},record.name," ",h("span",{style:{fontSize:11,color:C.sub,fontWeight:600}},patient?.kana)),
          h("div",{style:{fontSize:11,color:C.sub}},record.patientId,"　診療日 ",record.visitDate,"　",record.visitType==="first"?"初診":"再診")),
        h(StatusBadge,{status:record.status}),
        record._amending&&h(Badge,{color:"#fff",bg:"#c2255c"},"訂正入力中")),
      h("div",{style:{display:"flex",gap:7,alignItems:"center",flexWrap:"wrap"}},
        savedAt&&h("span",{style:{fontSize:11,color:C.sub}},"自動保存 "+fmtDateTime(savedAt)),
        h(Btn,{variant:"subtle",onClick:()=>setHistOpen(true),style:{padding:"7px 11px",fontSize:12}},"履歴"),
        h(Btn,{variant:"ghost",onClick:()=>setPrintOpen(true),style:{padding:"7px 11px",fontSize:12}},"帳票出力"),
        !isFinalized&&editClinical&&h(Btn,{variant:"subtle",onClick:saveDraft,style:{padding:"7px 11px",fontSize:12}},"下書き保存"),
        !isFinalized&&user.canFinalize&&h(Btn,{variant:"accent",onClick:()=>setFinalizeOpen(true),style:{padding:"7px 13px",fontSize:12}},"確定"),
        isFinalized&&!record._amending&&user.canFinalize&&h(Btn,{variant:"danger",onClick:()=>setAmendOpen(true),style:{padding:"7px 11px",fontSize:12}},"訂正"),
        record._amending&&h(Btn,{variant:"accent",onClick:commitAmend,style:{padding:"7px 13px",fontSize:12}},"訂正を確定"))),
    readOnly&&!record._amending&&h("div",{style:{fontSize:12.5,color:"#1971c2",background:"#e7f5ff",border:"1px solid #a5d8ff",borderRadius:9,padding:"8px 12px",marginBottom:10}},
      isFinalized?"確定済みのため閲覧モードです。変更するには「訂正」を行ってください。":`${user.roleLabel}は臨床記録（病名・処置・歯式）を編集できません（閲覧のみ）。`),
    // タブ
    h("div",{style:{display:"flex",gap:5,overflowX:"auto",paddingBottom:6,marginBottom:12}},
      TABS.map(t=>h("button",{key:t.key,onClick:()=>setTab(t.key),
        style:{whiteSpace:"nowrap",padding:"9px 13px",borderRadius:9,border:"1px solid "+(tab===t.key?C.accent:C.line),background:tab===t.key?C.accent:"#fff",color:tab===t.key?"#fff":C.ink,fontWeight:700,fontSize:12.5,cursor:"pointer",minHeight:44,position:"relative"}},
        t.label, t.key==="error"&&errCount>0&&h("span",{style:{position:"absolute",top:-4,right:-4,background:"#c92a2a",color:"#fff",borderRadius:10,fontSize:10,padding:"1px 5px"}},errCount)))),
    // タブ本体
    h(Card,{title:TABS.find(t=>t.key===tab).label,right:h(Badge,{},TABS.find(t=>t.key===tab).scr)},
      tab==="header" && h(HeaderForm,{record,patient,onChange:change,readOnly:(isFinalized&&!record._amending),user}),
      tab==="tooth" && h(ToothPanel,{findings:record.findings||{},setFindings,selectedIds,setSelectedIds,readOnly,onAudit:audit,flagIds:issues.filter(i=>i.goto==="tooth").flatMap(()=>[])}),
      tab==="disease" && h(DiseasePanel,{record,onChange:change,readOnly,selectedIds}),
      tab==="proc" && h(ProcedurePanel,{record,onChange:change,readOnly,selectedIds,onGoto:gotoFix,onFunc}),
      tab==="perio" && h(PerioPanel,{record,onChange:change,readOnly,selectedIds}),
      tab==="soap" && h(SoapPanel,{record,onChange:change,readOnly}),
      tab==="chart2" && h(Chart2Panel,{record,patient,onChange:change,readOnly:(isFinalized&&!record._amending),monthAccum}),
      tab==="error" && h(ErrorPanel,{issues,onGoto:gotoFix}),
      tab==="receipt" && h(ReceiptPanel,{record,patient,monthAccum})
    ),
    // 部位選択の共有ヒント（病名・処置・歯周タブで有効）
    (tab==="disease"||tab==="proc"||tab==="perio") && h("div",{style:{fontSize:11.5,color:C.sub,textAlign:"center",marginTop:-4}},
      "※ 部位は「歯式」タブで選択した歯（",selectedIds.length,"歯）が連動します。"),
    h(SurfaceDialog,{open:!!surfaceFor,proc:surfaceFor,onClose:()=>setSurfaceFor(null),onSave:surfaces=>{ change({...record,procedures:record.procedures.map(p=>p.id===surfaceFor.id?{...p,surfaces}:p)}); setSurfaceFor(null); }}),
    h(FinalizeDialog,{open:finalizeOpen,onClose:()=>setFinalizeOpen(false),onConfirm:doFinalize,record,user}),
    h(AmendDialog,{open:amendOpen,onClose:()=>setAmendOpen(false),onConfirm:startAmend}),
    h(HistoryPanel,{open:histOpen,record,onClose:()=>setHistOpen(false)}),
    printOpen && h(PrintView,{record,patient,onClose:()=>setPrintOpen(false)})
  );
}

/* ===========================================================================
   newRecord
   =========================================================================== */
function newRecord(patient, user, visitType){
  const now=nowISO();
  return {
    id:"REC-"+uid(), patientId:patient.id, status:"draft", version:0,
    name:patient.name, kana:patient.kana, birth:patient.birth, sex:patient.sex, address:patient.address, job:patient.job, tel:patient.tel, relation:patient.relation,
    insurerNo:patient.insurerNo, symbol:patient.symbol, insuredNo:patient.insuredNo, kohi:patient.kohi||[],
    lateElderly2:patient.lateElderly2||false, incomeHigh:false,
    visitDate:todayStr(), startDate:todayStr(), visitType:visitType==="初診"?"first":"recall",
    chiefComplaint:"", soap:{s:"",o:"",a:"",p:""}, oralNote:"",
    findings:{}, diseases:[], procedures:[], perio:{}, corrections:{}, receiptComments:[],
    enteredByName:user.name, enteredById:user.id, createdAt:now, updatedAt:now,
    finalizedAt:null, finalizedByName:null,
    history:[{action:"新規作成",userName:user.name,at:now}]
  };
}

/* ===========================================================================
   ルート App
   =========================================================================== */
function App(){
  const [user,setUser]=useState(null);
  const [patients,setPatients]=useState(SAMPLE_PATIENTS);
  const [records,setRecords]=useState([]);
  const [view,setView]=useState("patients");
  const [activePatient,setActivePatient]=useState(null);
  const [activeRecordId,setActiveRecordId]=useState(null);
  const [auditOpen,setAuditOpen]=useState(false);
  const [pmOpen,setPmOpen]=useState(false);
  const [loaded,setLoaded]=useState(false);

  useEffect(()=>{ const p=store.get("dental_patients_v2",null); const r=store.get("dental_records_v2",null); if(p)setPatients(p); if(r)setRecords(r); setLoaded(true); },[]);
  useEffect(()=>{ if(loaded) store.set("dental_patients_v2",patients); },[patients,loaded]);
  useEffect(()=>{ if(loaded) store.set("dental_records_v2",records); },[records,loaded]);

  const openPatient=(patient,visitType)=>{
    setActivePatient(patient);
    const existing=records.filter(r=>r.patientId===patient.id).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
    let rec=existing.find(r=>r.status==="draft" && r.visitDate===todayStr());
    if(!rec){ rec=newRecord(patient,user,visitType); setRecords(rs=>[...rs,rec]); }
    setActiveRecordId(rec.id); setView("workspace");
    pushAudit({type:"患者参照",detail:patient.name,user:user.name,patient:patient.name});
  };
  const newPatient=()=>{
    const n=patients.length+1;
    const np={ id:`PT-${String(10000+n).slice(1)}`, kana:"", name:"新規患者", birth:"", sex:"", address:"", job:"", tel:"", relation:"本人", insurerNo:"", symbol:"", insuredNo:"", kohi:[] };
    setPatients(ps=>[...ps,np]); pushAudit({type:"患者登録",detail:np.id,user:user.name});
    const rec=newRecord(np,user,"初診"); setRecords(rs=>[...rs,rec]); setActivePatient(np); setActiveRecordId(rec.id); setView("workspace");
  };
  const saveRecord=(updated)=>setRecords(rs=>rs.map(r=>r.id===updated.id?updated:r));

  if(!user) return h(Login,{onLogin:u=>{ setUser(u); setView("patients"); }});
  const activeRecord=records.find(r=>r.id===activeRecordId);
  return h("div",{style:{minHeight:"100vh",background:C.bg}},
    view==="patients" && h(PatientSelect,{patients,records,user,onOpen:openPatient,onNew:newPatient,onLogout:()=>setUser(null),onOpenAudit:()=>setAuditOpen(true),onOpenPointMaster:(user.isAdmin||user.role==="clerk")?()=>setPmOpen(true):null}),
    view==="workspace" && activeRecord && h(Workspace,{key:activeRecord.id,initialRecord:activeRecord,patient:activePatient,user,records,onSave:saveRecord,onBack:()=>setView("patients")}),
    h(AuditPanel,{open:auditOpen,onClose:()=>setAuditOpen(false)}),
    h(PointMasterPanel,{open:pmOpen,onClose:()=>setPmOpen(false)}));
}

/* === マウント（制約環境向け：同期 ReactDOM.render を優先） === */
(function(){
  var container=document.getElementById("root");
  if(ReactDOM && typeof ReactDOM.render==="function"){ ReactDOM.render(React.createElement(App),container); }
  else if(ReactDOM && typeof ReactDOM.createRoot==="function"){ ReactDOM.createRoot(container).render(React.createElement(App)); }
  else { throw new Error("ReactDOM の描画APIが見つかりません"); }
})();
} catch (e) {
  document.getElementById("root").innerHTML='<div id="boot-msg">起動エラー: '+(e&&e.message?e.message:e)+'</div>';
  console.error(e);
}
</script></body></html>
